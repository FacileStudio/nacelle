# nacelle: the Go agent SDK for the Facile Suite.

kind: lib

ignore: [.git, node_modules, vendor, dist, build, target, testdata, .output, coverage]
extensions: [.go]

limits:
  fileLines: 250        # filet's own default: split the file
  funcsPerFile: 8
  funcLines: 30         # filet's own default
  funcStatements: 25    # filet's own default
  lineLength: 120       # lll default
  params: 5
  returns: 3
  nesting: 4            # filet's own default
  complexity: 10        # filet's own default
  structFields: 12      # filet's own default
  interfaceMethods: 4   # filet's own default

disabled:
  # gofmt/rustfmt/prettier owns line breaking; every survivor is a line no
  # formatter could have wrapped. Flagging it is noise that teaches people to
  # stop reading the output. Nothing else is disabled: a rule turned off here
  # must be an argument, not a habit.
  - gen.line.long
architecture:
  fileNamePattern: '^[a-z0-9_]+\.go$'
  maxDepth: 3
  forbiddenImports:
    anthropic: [github.com/FacileStudio/nacelle/openrouter, github.com/FacileStudio/nacelle/openai, github.com/FacileStudio/nacelle/google, github.com/FacileStudio/nacelle/internal/oairunner]
    openrouter: [github.com/FacileStudio/nacelle/anthropic, github.com/FacileStudio/nacelle/openai, github.com/FacileStudio/nacelle/google]
    openai: [github.com/FacileStudio/nacelle/anthropic, github.com/FacileStudio/nacelle/openrouter, github.com/FacileStudio/nacelle/google]
    google: [github.com/FacileStudio/nacelle/anthropic, github.com/FacileStudio/nacelle/openrouter, github.com/FacileStudio/nacelle/openai]
    tools: [github.com/anthropics/anthropic-sdk-go, github.com/openai/openai-go/v3]
    mcp: [github.com/anthropics/anthropic-sdk-go, github.com/openai/openai-go/v3]
    mcp/client: [github.com/anthropics/anthropic-sdk-go, github.com/openai/openai-go/v3]

# info, not error. Every style rule filet has is info severity, so failing on
# error alone can only fire on a Go file that does not parse or on a forbidden
# import — a gate that agrees with whatever is already committed. Measured: the
# repository has zero findings at this level, so the cost of holding it here is
# nothing and the cost of not doing so is a gate with no opinion.
failOn: error
