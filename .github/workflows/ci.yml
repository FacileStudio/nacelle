name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  filet:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FacileStudio/filet@v0.4.0
        with:
          # error, not info. Every style rule filet has is info severity, so a
          # gate failing on error alone can only fire on a Go file that does not
          # parse or on a forbidden import — which is a gate that agrees with
          # whatever is already committed. filet.yml records the same policy as
          # failOn: error; this input is the workflow's copy of it.
          fail-on: error
          # The run is always reported and the provider decides what deserves an
          # alert, so that policy lives in one place instead of in every fork's
          # workflow. The URL is withheld when the secret is not available: a
          # pull request from a fork gets no secrets, and signing with an empty
          # key would fail on another repository's configuration rather than on
          # this code.
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}
